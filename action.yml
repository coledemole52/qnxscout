name: "qnxscout - QNX 8.0 port readiness"
description: "Scan C/C++ code for what will break on QNX 8.0 and upload the results to GitHub code scanning."
branding:
  icon: "cpu"
  color: "blue"
inputs:
  path:
    description: "Directory to scan"
    default: "."
  fail-on:
    description: "Fail the job if a high-confidence finding of this severity or worse exists (blocker|runtime|link|review|info). Empty = never fail."
    default: ""
  sarif:
    description: "Where to write the SARIF report"
    default: "qnxscout.sarif"
runs:
  using: "composite"
  steps:
    - shell: bash
      run: python3 -m pip install --quiet "${{ github.action_path }}"
    - shell: bash
      run: |
        qnxscout scan "${{ inputs.path }}" -f sarif -o "${{ inputs.sarif }}"
        qnxscout scan "${{ inputs.path }}" -f md -o qnxscout.md
        cat qnxscout.md >> "$GITHUB_STEP_SUMMARY"
    - shell: bash
      if: ${{ inputs.fail-on != '' }}
      run: qnxscout scan "${{ inputs.path }}" --fail-on "${{ inputs.fail-on }}" > /dev/null
